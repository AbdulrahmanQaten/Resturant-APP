name: TajAlqaisar
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  google_nav_bar: ^5.0.6
  connectivity_plus: ^6.0.3
  intl: ^0.19.0

  cupertino_icons: ^1.0.6
  remixicon: ^1.0.0

  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # لتنسيق المحتوى في الصفحات المعلوماتية
  flutter_markdown: ^0.7.1

  http: ^1.2.1

  # إضافة هذه الحزمة لتحميل الصور في الكاش وحفظها بدلا من تحميلها كل مرة يتم فيها فتح التطبيق
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
